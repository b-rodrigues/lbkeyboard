;===============================================================================
; LAYOUT DESIGN:
;
; TOP ROW (11 keys):     Q  W  F  O  G  Z  U  K  L  P  J  [dead keys]
; HOME ROW (12 keys):    A  S  D  E  ,  H  N  T  R  I  M  É
; BOTTOM ROW (11 keys):  Y  X  C  V  B  .  Ä  '  Ë  Ç
;
; LAYER 0 (Direct):      Main letters + high-frequency accents (é, ä, ë, ç)
; LAYER 1 (Shift):       Capitals + secondary punctuation
; LAYER 2 (Ctrl):        --
; LAYER 6 (AltGr):       Secondary accents (è, à, ü, ö) + programming symbols
; LAYER 7 (Shift+AltGr): Additional symbols and rare characters
;
; DEAD KEYS (on ] key position):
;   Direct:    ^ (circumflex) -> â ê î ô û
;   Shift:     ¨ (trema)      -> ä ë ï ö ü ÿ
;   AltGr:     ` (grave)      -> à è ì ò ù
;   Shift+AltGr: ´ (acute)    -> á é í ó ú ý
;
; DESIGN PRINCIPLES:
; - Preserve Ctrl+Z/X/C/V shortcuts (Y X C V B on bottom row)
; - Direct access to most frequent accents: é (1003), ä (500), ë (273)
; - AltGr for secondary accents: è (via AltGr+É), ü (via AltGr+U), ö (via AltGr+O)
; - Dead keys for rare accents: ï, ÿ, î, etc.
; - Home row optimized for Luxembourg multilingual corpus
; - BÉPO-style direct comma and period
;===============================================================================

[layout]
;scan = VK	CapStat	0Norm	1Sh	2Ctrl	6AGr	7AGrSh	Caps	CapsSh

; === NUMBER ROW (unchanged from QWERTZ, but with programming symbols on AltGr) ===
SC002 = 1	1	1	+	--	|	¹	; 1
SC003 = 2	1	2	"	--	@	²	; 2
SC004 = 3	1	3	*	--	#	³	; 3
SC005 = 4	1	4	ç	--	$	¼	; 4 (keeping ç on number row too)
SC006 = 5	1	5	%	--	€	½	; 5
SC007 = 6	1	6	&	--	^	¾	; 6 (^ as dead key for circumflex)
SC008 = 7	1	7	/	--	{	⅛	; 7
SC009 = 8	1	8	(	--	[	«	; 8
SC00a = 9	1	9	)	--	]	»	; 9
SC00b = 0	1	0	=	--	}	°	; 0
SC00c = OEM_MINUS	0	-	_	--	\	¿	; - _
SC00d = OEM_PLUS	0	=	`	--	~	¡	; = `

; === TOP ROW: Q W F O G Z L K U P J ===
SC010 = Q	1	q	Q	--	@	Ω	; QWERTY Q -> Q
SC011 = W	1	w	W	--	ẃ	Ẃ	; QWERTY W -> W
SC012 = F	1	f	F	--	ſ	ª	; QWERTY E -> F
SC013 = O	5	o	O	--	ö	Ö	; QWERTY R -> O (AltGr = ö)
SC014 = G	1	g	G	--	ğ	Ğ	; QWERTY T -> G
SC015 = Z	1	z	Z	--	ž	Ž	; QWERTY Y -> Z
SC016 = U	5	u	U	--	ü	Ü	; QWERTY U -> U (same position! AltGr = ü)
SC017 = K	1	k	K	--	ĸ	&	; QWERTY I -> K
SC018 = L	1	l	L	--	ł	Ł	; QWERTY O -> L
SC019 = P	1	p	P	--	þ	Þ	; QWERTY P -> P
SC01a = J	1	j	J	--	ĳ	Ĳ	; QWERTY [ -> J
SC01b = OEM_6	0	dk1	dk5	--	dk2	dk3	; Dead keys: ^(dk1), ¨(dk5), `(dk2), ´(dk3)

; === HOME ROW: A S D E , H N T R I M É ===
SC01e = A	5	a	A	--	à	À	; QWERTY A -> A (AltGr = à)
SC01f = S	1	s	S	--	ß	ẞ	; QWERTY S -> S (AltGr = ß)
SC020 = D	1	d	D	--	ð	Ð	; QWERTY D -> D
SC021 = E	5	e	E	--	ê	Ê	; QWERTY F -> E (AltGr = ê via dead key alt)
SC022 = OEM_COMMA	0	,	;	--	'	"	; QWERTY G -> , (direct comma!)
SC023 = H	1	h	H	--	ħ	Ħ	; QWERTY H -> H
SC024 = N	1	n	N	--	ñ	Ñ	; QWERTY J -> N
SC025 = T	1	t	T	--	þ	Þ	; QWERTY K -> T
SC026 = R	1	r	R	--	®	™	; QWERTY L -> R
SC027 = I	1	i	I	--	î	Î	; QWERTY ; -> I
SC028 = M	1	m	M	--	µ	—	; QWERTY ' -> M
SC029 = OEM_7	0	$	£	--	¤	¥	; QWERTY ` (left of 1)
SC02b = OEM_1	5	é	É	--	è	È	; QWERTY \ -> É (AltGr = è!)

; === BOTTOM ROW: Y X C V B . Ä ' Ë Ç ^ ===
SC056 = OEM_102	1	<	>	--	|	¦	; ISO key (between LShift and Z)
SC02c = Y	1	y	Y	--	ÿ	Ÿ	; QWERTY Z -> Y (preserves Ctrl+Y undo redo)
SC02d = X	1	x	X	--	×	÷	; QWERTY X -> X (preserves Ctrl+X cut)
SC02e = C	1	c	C	--	©	¢	; QWERTY C -> C (preserves Ctrl+C copy)
SC02f = V	1	v	V	--	√	✓	; QWERTY V -> V (preserves Ctrl+V paste)
SC030 = B	1	b	B	--	„	"	; QWERTY B -> B
SC031 = OEM_PERIOD	0	.	:	--	…	·	; QWERTY N -> . (direct period!)
SC032 = OEM_3	5	ä	Ä	--	â	Â	; QWERTY M -> Ä (direct! AltGr = â)
SC033 = OEM_4	0	'	?	--	¿	‽	; QWERTY , -> ' (apostrophe direct)
SC034 = OEM_5	5	ë	Ë	--	ï	Ï	; QWERTY . -> Ë (direct! Luxembourgish)
SC035 = OEM_2	5	ç	Ç	--	č	Č	; QWERTY / -> Ç (direct!)

; === SPACE BAR ===
SC039 = SPACE	0	{Space}	{Space}	--	{Space}	 	; Space (with non-breaking space on AltGr)

; === NUMPAD (unchanged) ===
SC053 = DECIMAL	0	.	.	--	--	--	; Numpad decimal


