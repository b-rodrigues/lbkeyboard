[layout]
;scan = VK	CapStat	0Norm	1Sh	2Ctrl	6AGr	7AGrSh	Caps	CapsSh

; === NUMBER ROW (BÉPO style) ===
SC002 = 1	        1	1	%	--	—	„	; QWERTY 1!
SC003 = 2	        1	2	@	--	<	"	; QWERTY 2@
SC004 = 3	        1	3	#	--	>	"	; QWERTY 3#
SC005 = 4	        1	4	$	--	"	⩽	; QWERTY 4$
SC006 = 5	        1	5	+	--	|	⩾	; QWERTY 5%
SC007 = 6	        1	6	-	--	^	⌨	; QWERTY 6^
SC008 = 7	        5	7   /	--	\	¬	; QWERTY 7&
SC009 = 8	        1	8	*	--	−	¼	; QWERTY 8*
SC00a = 9	        1	9	(	--	[	½	; QWERTY 9(
SC00b = 0	        1	0	)	--	]	¾	; QWERTY 0)
SC00c = OEM_MINUS	0	€   ’ 	--	{	′	; QWERTY -_
SC00d = OEM_PLUS	0	«	»	--	}	″	; QWERTY =+

; === TOP ROW: Q W F O G Z U K L P J ===
SC010 = Q	1	q	Q	--	œ	Œ	; Q: œ ligature on AltGr
SC011 = W	1	w	W	--	ẃ	Ẃ	; W
SC012 = F	1	f	F	--	ſ	ª	; F: long s
SC013 = O	5	o	O	--	ö	Ö	; O: ö on AltGr
SC014 = G	1	g	G	--	ğ	Ğ	; G
SC015 = Z	1	z	Z	--	ž	Ž	; Z
SC016 = U	5	u	U	--	ü	Ü	; U: ü on AltGr
SC017 = K	1	k	K	--	~	--	; K
SC018 = L	1	l	L	--	ł	Ł	; L
SC019 = P	1	p	P	--	&	§	; P: & on AltGr
SC01a = J	1	j	J	--	ĳ	Ĳ	; J
SC01b = OEM_6	0	dk1	dk5	--	dk2	dk3	; Dead keys: ^(dk1), ¨(dk5), `(dk2), ´(dk3)

; === HOME ROW: A S D E , H N T R I M É ===
SC01e = A	5	a	A	--	à	À	; A: à on AltGr
SC01f = S	1	s	S	--	ß	ẞ	; S: ß (eszett) on AltGr
SC020 = D	1	d	D	--	ð	Ð	; D
SC021 = E	5	e	E	--	ë	Ê	; E: ë on AltGr!
SC022 = OEM_COMMA	0	,	;	--	'	"	; , (direct comma!)
SC023 = H	1	h	H	--	ħ	Ħ	; H
SC024 = N	1	n	N	--	ñ	Ñ	; N: ñ on AltGr
SC025 = T	1	t	T	--	þ	Þ	; T
SC026 = R	1	r	R	--	®	™	; R
SC027 = I	1	i	I	--	î	Î	; I
SC028 = M	1	m	M	--	µ	—	; M
SC029 = OEM_7	0	$	£	--	¤	¥	; $ (left of 1)
SC02b = OEM_1	5	é	É	--	è	È	; É: é direct, è on AltGr!

; === BOTTOM ROW: Y X C V B . Ä ' ! Ç ===
SC056 = OEM_102	1	<	>	--	|	¦	; ISO key (between LShift and Z)
SC02c = Y	1	y	Y	--	ÿ	Ÿ	; Y (preserves Ctrl+Y)
SC02d = X	1	x	X	--	×	÷	; X (preserves Ctrl+X)
SC02e = C	1	c	C	--	©	¢	; C (preserves Ctrl+C)
SC02f = V	1	v	V	--	√	✓	; V (preserves Ctrl+V)
SC030 = B	1	b	B	--	„	"	; B
SC031 = OEM_PERIOD	0	.	:	--	…	·	; . (direct period!)
SC032 = OEM_3	5	ä	Ä	--	â	Â	; Ä: direct! â on AltGr
SC033 = OEM_4	0	'	?	--	¿	‽	; ' (apostrophe direct)
SC034 = OEM_5	5	!	|	--	¡	--	; !: direct! | on AltGr
SC035 = OEM_2	5	ç	Ç	--	č	Č	; Ç: direct!

; === SPACE BAR ===
SC039 = SPACE	4	={Space}	 	--	_	 	; Space (with non-breaking space on AltGr)

; === NUMPAD ===
SC053 = DECIMAL	0	.	.	--	--	--	; Numpad decimal


